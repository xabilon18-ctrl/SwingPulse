name: Publish Watchdog

# WHY THIS EXISTS (2026-08-06)
# publish.yml marks status.json as 'failed' from a step INSIDE its own job. That
# only works if the job actually starts. On 2026-08-06 both 14:35 UTC runs died
# with "The job was not acquired by Runner of type hosted even after multiple
# attempts" — GitHub never allocated a runner, so not one step ran, the failure
# notifier never fired, and status.json sat at state:'ok' from the 09:35 run.
# The app looked healthy for the next 32h until the stale banner tripped on
# summary.fetched_at. Runs: 31119778097 / 31119780169.
#
# workflow_run fires on the COMPLETION RECORD of the publish workflow, not from
# inside its job, so it survives a job that never got a runner.
#
# Caveat, stated plainly: this watchdog needs a runner too. A total Actions
# outage takes it down with the thing it is watching. It covers the common case
# (a capacity blip on one job) and not the rare one.

on:
  workflow_run:
    workflows: ["SwingPulse Daily Publish"]
    types: [completed]

  # Manual runs are a DRY RUN on purpose. A dispatch carries no
  # github.event.workflow_run context, so RUN_STARTED is empty and the
  # freshness comparison below cannot suppress anything — an unguarded manual
  # run would flip a healthy live app to state:'failed'. Dispatch therefore
  # evaluates the logic and prints the verdict without writing to R2.
  workflow_dispatch:

jobs:
  mark-failed:
    # Only act on a genuinely bad outcome. 'cancelled' is excluded on purpose —
    # it means a human stopped the run (e.g. de-duplicating two concurrent
    # publishes), which is not a pipeline failure and must not raise an alarm.
    # Origin-only, same guard publish.yml uses. This file also lives in the
    # mirror (xabilon18/SwingPulse), and status.json must have exactly ONE
    # writer or the two repos race each other on the same R2 key.
    if: >-
      github.repository == 'xabilon18-ctrl/SwingPulse' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out' ||
       github.event.workflow_run.conclusion == 'startup_failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Guard against a late watchdog stomping a good publish. The three daily
      # runs overlap in the queue, so a failed 09:35 can finish AFTER a healthy
      # 14:35 has already written state:'ok'. Writing 'failed' then would put a
      # red banner on fresh, correct data. Only mark failure if what is on R2
      # right now is older than this run's start.
      - name: Check whether R2 already has a newer successful publish
        id: check
        env:
          R2_PUBLIC: https://pub-e74b1a3a64724b07a76b853093e21240.r2.dev
          RUN_STARTED: ${{ github.event.workflow_run.run_started_at }}
        run: |
          set -uo pipefail
          summary="$(curl -sS --max-time 30 "$R2_PUBLIC/ma500/summary.json" || echo '')"
          fetched_at="$(printf '%s' "$summary" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("fetched_at",""))' 2>/dev/null || echo '')"

          echo "R2 summary.fetched_at = ${fetched_at:-<unreadable>}"
          echo "failed run started at = ${RUN_STARTED:-<manual>}"

          # Unreadable summary → alarm. Silence is the failure mode we are here for.
          if [ -z "$fetched_at" ] || [ -z "${RUN_STARTED:-}" ]; then
            echo "mark=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Compare as strings, not dates. Both sides are ISO-8601 UTC produced
          # by fixed writers (publish.py and the GitHub API), and for a common
          # YYYY-MM-DDTHH:MM:SS prefix lexicographic order IS chronological
          # order — no date library, and nothing that has to sit at column 0
          # inside this block scalar.
          ISO_RE='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}'
          a="${fetched_at:0:19}"
          b="${RUN_STARTED:0:19}"

          # Validate BEFORE comparing. A malformed value like "not-a-date" sorts
          # above any digit-leading timestamp and would silently suppress the
          # alarm — the exact failure this workflow exists to prevent.
          if ! [[ "$a" =~ $ISO_RE ]] || ! [[ "$b" =~ $ISO_RE ]]; then
            echo "Unparseable timestamp (data='$a' run='$b') — alarming rather than guessing."
            echo "mark=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$a" < "$b" ]]; then
            echo "R2 data is newer than the failed run — a later publish already succeeded. Staying quiet."
            echo "mark=false" >> "$GITHUB_OUTPUT"
          else
            echo "mark=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mark status.json failed on R2
        if: steps.check.outputs.mark == 'true' && github.event_name != 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FAILED_RUN: ${{ github.event.workflow_run.id }}
          REASON: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          printf '{"state":"failed","at":"%s","run":"%s","reason":"%s","by":"watchdog"}' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${FAILED_RUN:-manual}" "${REASON:-unknown}" \
            > /tmp/status.json
          cat /tmp/status.json
          curl -sS --fail-with-body -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/swingpulse-data/objects/ma500/status.json" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Cache-Control: no-cache, max-age=0" \
            --data-binary @/tmp/status.json

      - name: Fan out failure push
        if: steps.check.outputs.mark == 'true' && github.event_name != 'workflow_dispatch'
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          if [ -n "${SYNC_SECRET:-}" ]; then
            curl -sS -X POST \
              -H "X-Sync-Secret: $SYNC_SECRET" \
              -H "X-Profile: ma500" \
              https://swingpulse-sync.xabilon18.workers.dev/push/notify \
              || echo "(push fan-out failed — non-fatal)"
          else
            echo "(SYNC_SECRET not set — skipping push fan-out)"
          fi

      - name: Report
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "DRY RUN — nothing written to R2. Would have marked failed: ${{ steps.check.outputs.mark }}"
          elif [ "${{ steps.check.outputs.mark }}" = "true" ]; then
            echo "Publish run ${{ github.event.workflow_run.id }} failed (${{ github.event.workflow_run.conclusion }}) — status.json marked failed, push sent."
          else
            echo "Publish run ${{ github.event.workflow_run.id }} failed but newer data is already live — no alarm raised."
          fi
