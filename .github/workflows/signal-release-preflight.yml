name: Validate prepared signal release
on:
  push:
    branches: [codex/signal-preflight-20261011]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          pip install -r swing_generator/requirements.txt
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate signals and browser behavior
        working-directory: swing_generator
        run: |
          python3 tests/golden_test.py
          python3 tests/hourly_test.py
          python3 tests/four_hour_test.py
          python3 tests/trend_context_feed_test.py
          python3 tests/workflow_setup_test.py
          node tests/trend_context_test.cjs
          node tests/ma_clusters_test.cjs
          node tests/time_grid_test.cjs
          node tests/price_refresh_test.cjs
          node tests/chart_refresh_test.cjs
          node tests/freshness_test.cjs
          node tests/saved_work_test.cjs
          node webapp/sync-worker/test/auth_test.mjs
          node webapp/sync-worker/test/saved_work_test.mjs
          python3 webapp/publish.py --ui-only --build-only
          python3 tests/browser_fixture.py
          python3 -m http.server 8000 --directory webapp/publish/ui > /tmp/swingpulse-browser.log 2>&1 &
          node tests/app_smoke.cjs
          node tests/saved_work_browser.cjs
      - name: Restore production market cache without saving changes
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            swing_generator/cache_ma500
            swing_generator/output_ma500/names_cache.json
          key: parquet-ma500-${{ runner.os }}-preflight-${{ github.run_id }}
          restore-keys: parquet-ma500-${{ runner.os }}-
      - name: Require a populated cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=list(Path('swing_generator/cache_ma500').rglob('*.parquet'))
          print('Cached histories:',len(files))
          assert len(files)>700, 'No full market cache restored; refusing a cold Yahoo download'
          PY
      - name: Rebuild the complete dataset locally without publishing
        working-directory: swing_generator
        env:
          FETCH_MAX_AGE_HOURS: '87600'
          PYTHONUNBUFFERED: '1'
        run: |
          python3 main.py --profile ma500 --no-intraday --no-publish
          python3 webapp/publish.py --build-only
          python3 tools/validate_workflow_release.py
          python3 tools/validate_hourly_release.py
      - name: Verify existing Cloudflare resources without writing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          token=os.environ['CLOUDFLARE_API_TOKEN']
          assert account and token, 'Missing Cloudflare repository secrets'
          for label,path in [('Pages',f'/accounts/{account}/pages/projects/swingpulse200'),('Sync Worker',f'/accounts/{account}/workers/services/swingpulse-sync'),('Hourly scheduler',f'/accounts/{account}/workers/services/swingpulse-cron'),('R2 bucket',f'/accounts/{account}/r2/buckets/swingpulse-data')]:
              req=urllib.request.Request('https://api.cloudflare.com/client/v4'+path,headers={'Authorization':'Bearer '+token})
              with urllib.request.urlopen(req,timeout=30) as response:payload=json.load(response)
              assert payload.get('success'),label+' access failed'
              print(label+': read access verified')
          print('No production writes or deployments performed. Read access does not prove write access.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-release-checks
          path: |
            swing_generator/hourly-chart-mobile.png
            swing_generator/webapp/publish/data_ma500/trend_channels.json
            swing_generator/webapp/publish/data_ma500/alerts.json
            swing_generator/webapp/publish/data_ma500/ledger_summary.json
          retention-days: 3
