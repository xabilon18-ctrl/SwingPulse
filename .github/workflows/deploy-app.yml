name: Validate and deploy SwingPulse app

on:
  push:
    branches: [main, codex/restore-hourly-20261007]
    paths:
      - 'swing_generator/**'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch:

permissions:
  contents: read

# Shares the existing data publisher's lock: neither can overwrite the other's
# output during an app release. UI releases run on code changes, never on cron.
concurrency:
  group: swingpulse-publish
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'xabilon18-ctrl/SwingPulse'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FETCH_MAX_AGE_HOURS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Determine whether this release changes market data
        id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          if os.environ['GITHUB_EVENT_NAME'] != 'push':
              required = True
          else:
              before = os.environ.get('BEFORE_SHA', '')
              if not before or set(before) == {'0'}:
                  required = True
              else:
                  paths = subprocess.check_output(
                      ['git', 'diff', '--name-only', before, os.environ['GITHUB_SHA']],
                      text=True).splitlines()
                  ui_paths = ('swing_generator/webapp/static/',
                              'swing_generator/webapp/templates/',
                              'swing_generator/tests/')
                  required = any(path.startswith('swing_generator/')
                                 and not path.startswith(ui_paths)
                                 and not path.endswith('.md')
                                 and path != 'swing_generator/tools/validate_hourly_release.py'
                                 for path in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'data_required={str(required).lower()}\n')
          print('Market data rebuild required:', required)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          pip install -r swing_generator/requirements.txt
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate existing engine and restored hourly path
        working-directory: swing_generator
        run: |
          python3 tests/golden_test.py
          python3 tests/macro_events_test.py
          python3 tests/hourly_test.py
          node --check webapp/static/js/app.js
          node tests/time_grid_test.cjs
          node tests/price_refresh_test.cjs
          node tests/chart_refresh_test.cjs
          node webapp/sync-worker/test/auth_test.mjs
      - name: Build UI and offline browser fixtures
        working-directory: swing_generator
        run: |
          python3 webapp/publish.py --ui-only --build-only
          python3 tests/browser_fixture.py
      - name: Mobile browser validation including data and chart refresh
        run: |
          python3 -m http.server 8000 --directory swing_generator/webapp/publish/ui > /tmp/swingpulse-preview.log 2>&1 &
          node swing_generator/tests/app_smoke.cjs
      - name: Verify Pages deployment capability on an isolated preview
        if: github.ref != 'refs/heads/main'
        run: npx --yes wrangler@4.45.0 pages deploy swing_generator/webapp/publish/ui --project-name swingpulse200 --branch codex-1h-preview
      - name: Restore market cache for production release
        if: github.ref == 'refs/heads/main' && steps.scope.outputs.data_required == 'true'
        uses: actions/cache@v4
        with:
          path: |
            swing_generator/cache_ma500
            swing_generator/output_ma500/names_cache.json
          key: parquet-ma500-${{ runner.os }}-${{ github.run_id }}
          restore-keys: parquet-ma500-${{ runner.os }}-
      - name: Generate and validate production data before uploading
        if: github.ref == 'refs/heads/main' && steps.scope.outputs.data_required == 'true'
        working-directory: swing_generator
        run: |
          python3 main.py --profile ma500 --no-publish
          python3 webapp/publish.py --build-only
          python3 tools/validate_hourly_release.py
          python3 tools/shape_audit.py --snapshot "$(ls -t output_ma500/signals_????-??-??.csv | head -1)" --only data
      - name: Publish validated data to existing R2 bucket
        if: github.ref == 'refs/heads/main' && steps.scope.outputs.data_required == 'true'
        working-directory: swing_generator
        run: |
          python3 - <<'PY'
          import sys
          from webapp.publish import upload_to_r2, R2_DATA_PREFIX
          ok, failed = upload_to_r2('webapp/publish/data_ma500', r2_prefix=R2_DATA_PREFIX)
          if failed:
              sys.exit(f'{failed} R2 uploads failed; frontend deployment stopped')
          print(f'{ok} files uploaded')
          PY
          python3 tools/health_check.py --max-age-hours 0.75
      - name: Deploy UI to existing production Pages project
        if: github.ref == 'refs/heads/main'
        run: npx --yes wrangler@4.45.0 pages deploy swing_generator/webapp/publish/ui --project-name swingpulse200 --branch main
      - name: Verify the live app and hourly data
        if: github.ref == 'refs/heads/main'
        env:
          SMOKE_LIVE: '1'
          SMOKE_URL: https://swingpulse200.pages.dev
        run: |
          python3 swing_generator/tools/validate_hourly_release.py --live
          node swing_generator/tests/app_smoke.cjs
      - name: Retain mobile verification screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hourly-mobile-verification
          path: hourly-chart-mobile.png
          retention-days: 3
