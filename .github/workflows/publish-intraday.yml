name: SwingPulse Intraday Publish

on:
  # Every 2 hours from 07:00 to 22:00 UTC, Mon–Fri (07,09,11,13,15,17,19,21)
  # 8 runs/day × 5 days × ~4.3 weeks ≈ 172 runs/month × 5 min ≈ 860 min
  # (private repo free tier: 2,000 min/month → very comfortable margin)
  schedule:
    - cron: '0 7-22/2 * * 1-5'

  # Manual trigger for testing or missed runs
  workflow_dispatch:

jobs:
  publish-intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # ── 1. Get the code ──────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r swing_generator/requirements.txt

      # ── 3. Node + Wrangler (for R2 uploads) ─────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      # ── 4. Restore parquet cache (shared with daily pipeline) ────────────
      - name: Restore parquet cache
        uses: actions/cache@v4
        with:
          path: swing_generator/cache
          key: parquet-${{ runner.os }}-${{ github.run_id }}
          restore-keys: parquet-${{ runner.os }}-

      # ── 5. Run the intraday pipeline ─────────────────────────────────────
      - name: Fetch data + compute signals + publish to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd swing_generator
          python3 main_intraday.py

      # ── 6. Done ───────────────────────────────────────────────────────────
      - name: Done
        run: echo "SwingPulse Intraday updated at $(date -u '+%Y-%m-%d %H:%M UTC')"
