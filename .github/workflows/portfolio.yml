name: Update Portfolio

on:
  workflow_dispatch:   # Manual trigger — tap "Run workflow" on GitHub

jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install google-auth google-auth-oauthlib google-api-python-client

      - name: Set up Node.js + Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Write Gmail credentials
        env:
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
        run: |
          cd swing_generator
          echo "$GMAIL_CREDENTIALS" > credentials.json
          echo "$GMAIL_TOKEN" > token.json

      - name: Parse XM email & upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd swing_generator
          python3 gmail_portfolio.py

      - name: Done
        run: echo "Portfolio updated at $(date -u '+%Y-%m-%d %H:%M UTC')"
