name: SwingPulse Daily Publish

on:
  # Auto-run weekdays at 21:00 UTC = 23:00 SAST (after market close)
  schedule:
    - cron: '30 3 * * 1-5'

  # Manual trigger — tap "Run workflow" in GitHub app or website
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ── 1. Get the code ──────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r swing_generator/requirements.txt

      # ── 3. Node + Wrangler (for R2 uploads) ─────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      # ── 4. Restore parquet cache (speeds up data fetch significantly) ────
      - name: Restore parquet cache
        uses: actions/cache@v4
        with:
          path: swing_generator/cache
          key: parquet-${{ runner.os }}-${{ github.run_id }}
          restore-keys: parquet-${{ runner.os }}-

      # ── 5. Google Sheets credentials (optional — skipped if not set) ─────
      - name: Write Google service account
        env:
          SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SA_JSON" ]; then
            mkdir -p swing_generator/credentials
            echo "$SA_JSON" > swing_generator/credentials/service_account.json
          fi

      # ── 6. Run the full pipeline ─────────────────────────────────────────
      - name: Fetch data + compute signals + publish to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd swing_generator
          python3 main.py

      # ── 7. Show run summary ───────────────────────────────────────────────
      - name: Done
        run: echo "SwingPulse updated at $(date -u '+%Y-%m-%d %H:%M UTC')"
