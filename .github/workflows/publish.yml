name: SwingPulse Daily Publish

on:
  # The stale banner does NOT need to be kept in sync: since app.js v231 it reads
  # summary.fetched_at against a flat 32h and knows nothing about this schedule.
  schedule:
    # WEEKDAYS are no longer scheduled here (2026-09-24). GitHub queues cron
    # runs 2.5-5h late (measured Sep 2026), so the 30-minute cadence the user
    # asked for — every :00 and :30, 05:00-23:00 SAST, Mon-Fri — is driven by
    # a Cloudflare Cron Trigger (swing_generator/webapp/cron-worker) that calls
    # workflow_dispatch on the minute. The repo went PUBLIC the same day, which
    # is what makes 31 runs a day free (GitHub Free caps PRIVATE repos at
    # 2,000 min/month). Weekends stay here: crypto only, once a day.
    - cron: '0 8  * * 6,0'   # 10:00 SAST Sat+Sun — crypto trades 24/7

  # Manual trigger
  workflow_dispatch:
    inputs:
      backfill_sectors:
        description: >-
          Rebuild sector-activity history from the parquet cache, then
          republish. One-off, for after instruments are ADDED: the radar scores
          each sector against its own 20-day baseline, so a brand-new sector
          (Currency, when forex came back 2026-08-25) has no history to score
          against and its spoke reads "--" for ~10 sessions. Leave OFF for
          normal runs — it costs a second full R2 upload pass.
        type: boolean
        default: false

# One publish at a time. Eight weekday runs land ~2h apart but GitHub's delay
# varies by hours, so two can overlap — and two publishes writing the same R2
# keys is how the ledger was clobbered 342→43 on 2026-07-10. A run that arrives
# while one is in flight waits; if a third arrives, GitHub drops the older
# waiting one, which is fine — the newer run publishes newer data.
concurrency:
  group: swingpulse-publish
  cancel-in-progress: false

jobs:
  publish:
    # This workflow file lives in TWO repos (origin = xabilon18-ctrl/SwingPulse,
    # mirror = xabilon18/SwingPulse). Scheduled runs fire ONLY on origin —
    # on 2026-07-10 both repos' crons raced each other publishing to the same
    # R2 bucket and an out-of-date mirror overwrote fresh data. Manual
    # workflow_dispatch still works from either repo.
    if: github.event_name != 'schedule' || github.repository == 'xabilon18-ctrl/SwingPulse'
    runs-on: ubuntu-latest
    # 90 min so a cold-cache full download (first run / evicted cache) or a
    # Yahoo CI-IP throttle can't trip the timeout; warm runs finish in ~20 min.
    timeout-minutes: 90

    steps:

      # ── 1. Get the code ──────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r swing_generator/requirements.txt

      # ── 3. Restore MA200 parquet cache ───────────────────────────────────
      # Node/Wrangler not needed in CI — R2 uploads go direct via CLOUDFLARE_API_TOKEN
      # names_cache.json rides along: without it build_names() refetches all 741
      # company names from yfinance every run, and a rate-limited run would
      # publish a names.json full of blanks (cards show full names since v214).
      - name: Restore MA500 parquet cache
        uses: actions/cache@v4
        with:
          path: |
            swing_generator/cache_ma500
            swing_generator/output_ma500/names_cache.json
          key: parquet-ma500-${{ runner.os }}-${{ github.run_id }}
          restore-keys: parquet-ma500-${{ runner.os }}-

      # ── 5. Golden-file regression — never publish signals from a changed
      #        engine that nobody reviewed (fails fast, before the 20-min run)
      - name: Signal engine golden test
        run: |
          cd swing_generator
          python3 tests/golden_test.py
          # The FOMC calendar parser is regexes over someone else's HTML — the
          # most breakable thing in the pipeline, and it fails SILENTLY: zero
          # rows just reads as "no meetings scheduled". Offline, against a
          # trimmed copy of the real page in tests/fixtures/.
          python3 tests/macro_events_test.py

      # ── 6. Run pipeline ──────────────────────────────────────────────────
      - name: Fetch data + compute signals + publish to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Optional. Adds the CPI / PCE / payrolls / GDP release dates to the
          # event calendar (macro_events.fetch_fred). Unset is a supported
          # state: fetch_fred returns [] and prints why, and the FOMC half
          # still ships. Free key from fred.stlouisfed.org/docs/api/api_key.html
          # -> add as repo secret FRED_API_KEY. Until then the calendar's gap
          # note tells the user those releases are missing, which is why this
          # is wired up rather than left out: an unwired key means that note
          # can never come down.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Download prices on EVERY run (2026-09-11). data_fetcher's local
          # default is a 20h gate; here it meant only the first run of the day
          # fetched, and the next morning's run finalised that mid-session
          # snapshot as a closed bar. ~1 extra minute and ~90 Actions minutes a month.
          FETCH_MAX_AGE_HOURS: '1'
        run: |
          cd swing_generator
          python3 main.py --profile ma500

      # ── 6-bis. One-off: seed radar history for newly added instruments ───
      # Runs AFTER main.py on purpose — backfill() reads the parquet cache, and
      # a brand-new instrument has no parquet until main.py has fetched it. The
      # republish is what carries the rebuilt sector_activity.json to R2;
      # publish.py re-reads THIS run's own fresh CSVs, so it is not the stale
      # local-publish trap (that one is a dev machine publishing day-old CSVs).
      # health_check below still passes: the republish rewrites every file with
      # a newer timestamp, which is exactly what --max-age-hours 2 asserts.
      - name: Backfill sector activity + republish
        if: ${{ inputs.backfill_sectors }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd swing_generator
          python3 sector_activity.py --backfill
          python3 sector_activity.py --report
          python3 webapp/publish.py --profile ma500

      # ── 6a. Did the publish actually MOVE the data? ───────────────────────
      # A green run is not proof of a good publish. From 07-28 to 08-13 every
      # run here exited 0 while the ledger, radar, sector series and flavours
      # sat frozen at an 08-04 timestamp — the loaders could not read their own
      # series back from R2 and correctly declined to save, which is not an
      # error, so nothing failed and nothing said anything.
      #
      # Checks LIVE R2, not the local working copy, so it also proves the
      # upload landed. --max-age-hours 2 asserts "this run wrote every file":
      # a file left over from the previous run has to be older than the gap
      # between two crons, or it sneaks past. Was 3h when the tightest gap was
      # 5h; the 17:05 run added 2026-08-27 sits 2.5h after 14:35, so 3h would
      # now accept a file the previous run wrote. Cut to 0.75h on 2026-09-15
      # when the US-session runs put landings ~1h apart. Warm runs take ~8 min
      # end to end, so a file this run wrote is minutes old. Runs that queue
      # back-to-back can still sneak one past — the limit of an age check.
      # See tools/health_check.py.
      #
      # MUST stay above the notifier below — `if: failure()` only fires for
      # steps that already ran, so a check placed after it would fail the run
      # without ever flipping status.json or raising the banner.
      - name: Verify the publish moved the data
        run: |
          cd swing_generator
          python3 tools/health_check.py --max-age-hours 0.75

      # ── 6b. Does the data LOOK like data? ────────────────────────────────
      # health_check.py above proves every file was written by this run. It
      # cannot tell you the numbers inside are sane, and that is the failure
      # that has cost the most here: on 2026-07-25 Yahoo served bars with
      # volume and no price, 365 instruments went silently NEUTRAL, and every
      # file published on time. The app showed half its board as blank cards,
      # which reads as a quiet market rather than a broken feed.
      #
      # --only data on purpose. The tool also has code-shape checks (does the
      # front end compare against a value that never occurs), but those cannot
      # change between two runs of the same commit, so gating the daily data
      # publish on them would let a cosmetic front-end slip block a day of
      # market data. They run in test.yml, on the code push, where they belong.
      #
      # MUST stay above the `if: failure()` notifier below, same as 6a — that
      # notifier only fires for steps that already ran.
      - name: Shape audit — do the numbers look like numbers
        run: |
          cd swing_generator
          python3 tools/shape_audit.py --only data

      # ── 6c. On failure: mark status on R2 + push so phones hear about it ──
      # Success runs overwrite status.json back to state:'ok' via publish.py.
      - name: Notify failure
        if: failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          printf '{"state":"failed","at":"%s","run":"%s"}' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ github.run_id }}" > /tmp/status.json
          curl -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/swingpulse-data/objects/ma500/status.json" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Cache-Control: no-cache, max-age=0" \
            --data-binary @/tmp/status.json || echo "(status upload failed)"
          if [ -n "$SYNC_SECRET" ]; then
            curl -sS -X POST \
              -H "X-Sync-Secret: $SYNC_SECRET" \
              -H "X-Profile: ma500" \
              https://swingpulse-sync.xabilon18.workers.dev/push/notify \
              || echo "(push fan-out failed)"
          fi

      # ── 7. Fan out push notifications ────────────────────────────────────
      - name: Trigger push notifications
        if: success()
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          if [ -n "$SYNC_SECRET" ]; then
            curl -sS -X POST \
              -H "X-Sync-Secret: $SYNC_SECRET" \
              -H "X-Profile: ma500" \
              https://swingpulse-sync.xabilon18.workers.dev/push/notify \
              || echo "(push fan-out failed — non-fatal)"
          else
            echo "(SYNC_SECRET not set — skipping push fan-out)"
          fi

      # ── 8. Show run summary ───────────────────────────────────────────────
      - name: Done
        run: echo "SwingPulse updated at $(date -u '+%Y-%m-%d %H:%M UTC')"
