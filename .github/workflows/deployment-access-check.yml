name: Check Cloudflare deployment access
on:
  push:
    branches: [codex/deployment-access-check-20261007]
    paths: [.github/workflows/deployment-access-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify existing Pages project access without deploying
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "").strip()
          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()
          if not token or not account:
              sys.exit("Required Cloudflare repository secrets are missing.")
          url = f"https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/swingpulse200"
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              sys.exit(f"Pages project access denied or unavailable: HTTP {exc.code}. No deployment attempted.")
          except Exception:
              sys.exit("Pages project access check failed. No deployment attempted.")
          if not payload.get("success"):
              sys.exit("Cloudflare rejected the Pages project access check.")
          project = payload.get("result", {})
          if project.get("name") != "swingpulse200":
              sys.exit("Unexpected Pages project; stopping.")
          print("Existing swingpulse200 Pages project is accessible.")
          print("No app build, R2 writes, or deployment was performed.")
          print("Read access alone does not prove deployment permission.")
          PY
