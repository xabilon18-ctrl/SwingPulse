# SwingPulse run scheduler (hourly, 24/7 since 2026-10-10).
#
# GitHub's own cron queues scheduled runs 2.5-5h late (measured Sep 2026), so a
# dependable hourly cadence cannot live there. Cloudflare Cron Triggers fire on the
# minute; each one asks GitHub to start publish.yml via workflow_dispatch,
# which starts within seconds. The workflow's concurrency group still stops two
# runs overlapping.
#
# Every hour at :05 UTC, all day, every day. The five-minute offset gives
# Yahoo time to publish completed hourly candles. This is also :05 in SAST.
#
# Secret (set once, by hand — a fine-grained token for THIS repo only,
# permission "Actions: Read and write"):
#     npx wrangler secret put GH_TOKEN
name               = "swingpulse-cron"
main               = "src/index.js"
compatibility_date = "2025-01-01"

# :35 is a backup (src/index.js `backup`): it dispatches when no run was
# created in the last 45 minutes, i.e. when the :05 dispatch was lost
# (2026-10-20 14:05), or when the recent run has already finished without
# success (2026-10-28). A missed hour then costs ~30 minutes, not two hours.
[triggers]
crons = ["5 * * * *", "35 * * * *"]

# Keep the Worker's logs (2026-10-20). The 14:05 dispatch ran and called GitHub
# (Cloudflare analytics: success, 1 subrequest) yet no run was created, and
# dispatch() reports GitHub's answer only through console.error — which, with
# no stored logs, existed only for a live `wrangler tail`. Free plan: 200,000
# log events a day; this Worker sees ~140-240 requests a day (cron + /live).
[observability]
enabled = true

[vars]
REPO     = "xabilon18-ctrl/SwingPulse"
WORKFLOW = "publish.yml"
REF      = "main"
