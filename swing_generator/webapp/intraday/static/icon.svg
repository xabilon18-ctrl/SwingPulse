<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#1a2332"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity=".3"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity=".3"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Subtle grid lines -->
  <line x1="80" y1="160" x2="432" y2="160" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="80" y1="256" x2="432" y2="256" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="80" y1="352" x2="432" y2="352" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Glow behind the heartbeat line -->
  <polyline points="60,300 130,300 160,300 190,260 210,340 240,180 270,380 300,220 330,280 360,260 400,240 452,200"
    fill="none" stroke="url(#glow)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Main heartbeat / trading pulse line -->
  <polyline points="60,300 130,300 160,300 190,260 210,340 240,180 270,380 300,220 330,280 360,260 400,240 452,200"
    fill="none" stroke="url(#line)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bright dot at the end -->
  <circle cx="452" cy="200" r="14" fill="#ef4444" opacity=".25"/>
  <circle cx="452" cy="200" r="8" fill="#ef4444"/>
</svg>
