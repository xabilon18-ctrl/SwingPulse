<!-- SwingPulse app icon — vector source of truth for the PNG set.
     Regenerate the PNGs with tools/gen_icons.py after editing this file.

     Two rules this file must keep:
       1. FULL BLEED, NO rx ON THE BACKGROUND RECT. The previous icon baked in
          rx="108", leaving transparent corners; iOS composites transparency
          onto BLACK and then applies its own squircle, so the icon read as a
          black tile. Let the platform do the masking.
       2. Everything inside the maskable safe circle (radius 40% = 204.8px).
          The mark is scaled 0.88 about the centre for this — at 1.0 the pulse
          dot reaches 229.8px and Android's maskable crop would clip it.

     Detail that does not survive 60pt was removed deliberately: the three
     0.045-opacity grid lines, the target rings, and the "500" chip whose
     26px text rendered about 3pt tall on a home screen. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#4BE3A0"/>
      <stop offset="1" stop-color="#1FA97A"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <g transform="translate(256,256) scale(0.88) translate(-256,-256)" fill="none"
     stroke="#0E1714" stroke-linecap="round" stroke-linejoin="round">
    <path d="M112 268 C162 300 226 302 272 240" stroke-width="16" opacity="0.20"/>
    <path d="M104 300 C160 344 236 348 288 268 C326 210 366 190 402 178" stroke-width="22" opacity="0.32"/>
    <path d="M96 334 C158 392 248 396 304 300 C346 228 388 202 426 186" stroke-width="42"/>
    <circle cx="426" cy="186" r="46" fill="#0E1714" stroke="none"/>
  </g>
</svg>
